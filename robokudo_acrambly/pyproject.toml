[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robokudo_acrambly"
description = "ACRAMbly perception components for RoboKudo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LGPL-3.0-only"
dynamic = ["version"]
dependencies = [
    "robokudo>=26.10.0",
    "semantic_digital_twin>=26.10.0",
    "krrood-core>=26.10.0",
    "krrood_spatial_math>=26.10.0",
    "numpy>=1.22.3",
    "typing_extensions",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["robokudo_acrambly*"]

[tool.setuptools.dynamic]
version = {attr = "robokudo_acrambly._version.__version__"}

[dependency-groups]
workspace = [
    "robokudo",
    "semantic_digital_twin",
    "krrood-core",
    "krrood_spatial_math",
]
